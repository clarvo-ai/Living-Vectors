name: Daily Update

on:
  schedule:
    # 18:00 Helsinki (16:00 UTC in winter; 19:00 Helsinki in summer)
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  dailyUpdate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot PyGithub google-genai
      - name: Run Daily Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python workflow-scripts/dailyUpdates.py "$REPO_NAME" "$GITHUB_TOKEN" "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID"
          echo "Daily update script executed successfully."
