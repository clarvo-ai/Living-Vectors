name: Daily Update

on:
  push:
    branches:
      - 'aari/automate-daily-status'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # added for testing manual triggers

jobs:
  dailyUpdate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot PyGithub
      - name: Run Daily Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python workflow-scripts/dailyUpdates.py "$REPO_NAME" "$GITHUB_TOKEN" "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID"
          echo "Daily update script executed successfully."
