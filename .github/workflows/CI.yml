name: Testing and Linting
on:
  push:
    branches: [dev]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r apps/lv-pyapi/requirements.txt
        continue-on-error: true

      # - name: Install bandit
      #   run: pip install bandit

      # - name: Run bandit
      #   run: bandit -r apps/lv-pyapi
      #   continue-on-error: true

  lint:
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

  tests:
    needs: lint
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dependencies
        run: npm install

      - name: Run lv-web tests
        working-directory: ./apps/lv-web
        run: npx jest --runInBand --coverage

      - name: Upload Jest coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: apps/lv-web/coverage/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/lv-pyapi/requirements.txt

      - name: Run test database migrations
        run: npx prisma migrate deploy --schema ./packages/database/prisma/schema/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_TTS_STT }}

      - name: Run lv-pyapi tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/apps/lv-pyapi:${{ github.workspace }}/packages/python-utils/src
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        working-directory: ./apps/lv-pyapi
        run: pytest tests --ignore=tests/manual --asyncio-mode=auto --cov=. --cov-report=term --cov-report=html

      - name: Upload Pytest coverage report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-report
          path: apps/lv-pyapi/htmlcov/

