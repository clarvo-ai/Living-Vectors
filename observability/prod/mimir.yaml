target: all,alertmanager

multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

common:
  storage:
    backend: gcs
    gcs:
      bucket_name: lv-mimir-dev

blocks_storage:
  backend: gcs
  gcs:
    bucket_name: lv-mimir-dev
  tsdb:
    dir: /data/mimir/tsdb

compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    kvstore:
      store: inmemory

distributor:
  ring:
    kvstore:
      store: inmemory

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1

ruler_storage:
  backend: gcs
  gcs:
    bucket_name: lv-mimir-dev

alertmanager_storage:
  backend: gcs
  gcs:
    bucket_name: lv-mimir-dev
