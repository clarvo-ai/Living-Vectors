target: compactor,distributor,ingester,querier,query-frontend,query-scheduler,store-gateway

multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

usage_stats:
  enabled: false

common:
  storage:
    backend: gcs
    gcs:
      bucket_name: lv-mimir-dev

blocks_storage:
  backend: gcs
  gcs:
    bucket_name: lv-mimir-dev
  tsdb:
    dir: /data/mimir/tsdb

compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    kvstore:
      store: inmemory

distributor:
  ring:
    kvstore:
      store: inmemory

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1
