services:
  lv-web:
    profiles: ['lv-web']
    container_name: lv-web
    image: lv-web
    restart: always
    build:
      context: .
      dockerfile: ./apps/lv-web/Dockerfile.web
    ports:
      - '3045:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - DIRECT_DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - NODE_ENV=development
      - NEXT_PUBLIC_PYAPI_URL=http://localhost:8091
      - NEXT_PUBLIC_APP_SOURCE_NAME=living-vectors
      - NEXT_PUBLIC_APP_NAME=LivingVectors
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - OTEL_SERVICE_NAME=lv-web
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    volumes:
      - .:/app
    # volumes:
    #   - ./apps/lv-web:/app/apps/lv-web
    #   - ./packages:/app/packages
    #   - ./scripts:/app/scripts
    #   - ./package-lock.json:/app/package-lock.json
    #   - ./package.json:/app/package.json
    #   - ./turbo.json:/app/turbo.json
    depends_on:
      - db
      - lv-pyapi
      - livekit
    command: sh -c "./scripts/init-db.sh && npm run dev:lv-web"

  lv-web-build:
    profiles: ['lv-web-build']
    container_name: lv-web-build
    image: lv-web-build
    restart: always
    build:
      context: .
      dockerfile: ./apps/lv-web/Dockerfile
    ports:
      - '3045:3000'
    env_file:
      - ./apps/lv-web/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - DIRECT_DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - NODE_ENV=development
      - PYAPI_URL=http://lv-pyapi:8080
      - NEXT_PUBLIC_APP_SOURCE_NAME=living-vectors
      - NEXT_PUBLIC_APP_NAME=LivingVectors
      - DB_SYNC_URL=http://db-sync:8080
    depends_on:
      - db

  lv-pyapi:
    profiles: ['lv-web', 'lv-pyapi']
    container_name: lv-pyapi
    image: lv-pyapi
    build:
      context: .
      dockerfile: ./apps/lv-pyapi/Dockerfile
    env_file:
      - ./apps/lv-pyapi/.env.local
    ports:
      - '8091:8080'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - PYTHONPATH=/app:/app/packages/python-utils/src
      - GOOGLE_APPLICATION_CREDENTIALS=/app/apps/lv-pyapi/credentials/google-credentials.json
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_AGENT_NAME=lv-voice-agent
      - INTERNAL_API_SECRET=localdev
      - OTEL_SERVICE_NAME=lv-pyapi
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    volumes:
      - ./apps/lv-pyapi:/app/apps/lv-pyapi
      - ./packages/python-utils:/app/packages/python-utils
    depends_on:
      - db
      - livekit
    restart: always

  lv-agent:
    profiles: ['lv-web', 'lv-agent']
    container_name: lv-agent
    image: lv-pyapi
    build:
      context: .
      dockerfile: ./apps/lv-pyapi/Dockerfile
    env_file:
      - ./apps/lv-pyapi/.env.local
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_AGENT_NAME=lv-voice-agent
      # Ensure both the pyapi root (tasks.py) and python-utils are importable
      - PYTHONPATH=/app:/app/apps/lv-pyapi:/app/packages/python-utils/src
      - BACKEND_URL=http://lv-pyapi:8080
      - INTERNAL_API_SECRET=localdev
      - OTEL_SERVICE_NAME=lv-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    volumes:
      - ./apps/lv-pyapi:/app/apps/lv-pyapi
      - ./packages/python-utils:/app/packages/python-utils
    depends_on:
      - livekit
    # agent.py lives in agents/ subdirectory; run from the pyapi WORKDIR
    command: python agents/agent.py
    restart: always

  # lv-pyapi-tests:

  prisma-migrate:
    profiles: ['prisma-migrate']
    container_name: living-vectors-db-migrate
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile.web
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - DIRECT_DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - APP_SOURCE_NAME=${APP_SOURCE_NAME:-unknown}
    depends_on:
      - db
    command: sh -c  "./scripts/wait-db.sh && cd packages/database && npx prisma migrate dev"
    volumes:
      - .:/app
      - /app/node_modules

  mock-migrate:
    profiles: ['mock-seed']
    container_name: living-vectors-mock-db-migrate
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile.web
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@mock-db:5432/postgres
      - DIRECT_DATABASE_URL=postgresql://postgres:postgres@mock-db:5432/postgres
      - NODE_ENV=development
      - APP_SOURCE_NAME=${APP_SOURCE_NAME:-unknown}
    depends_on:
      - mock-db
    command: sh -c "until pg_isready -h mock-db -U postgres; do sleep 1; done && cd packages/database && npx prisma migrate deploy && npm run db:generate"
    volumes:
      - .:/app
      - /app/node_modules

  mock-seed:
    profiles: ['mock-seed']
    container_name: living-vectors-mock-seed
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile.web
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@mock-db:5432/postgres
      - DIRECT_DATABASE_URL=postgresql://postgres:postgres@mock-db:5432/postgres
      - NODE_ENV=development
    depends_on:
      - mock-migrate
    command: sh -c "cd packages/database && npm run db:seed"
    volumes:
      - .:/app
      - /app/node_modules

  python-typegen:
    profiles: ['python-typegen']
    container_name: living-vectors-python-typegen
    build:
      context: ./packages/python-utils/src/typegen
      dockerfile: Dockerfile.typegen
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=db
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
    working_dir: /app/packages/python-utils/src/typegen
    volumes:
      - ./packages/python-utils/src:/app/packages/python-utils/src:rw
    user: '1000:1000'
    depends_on:
      - db

  container-node-modules:
    profiles: ['container-node-modules']
    container_name: container-node-modules
    build:
      context: .
      dockerfile: ./Dockerfile.container-node-modules
    working_dir: /app
    volumes:
      - ./container_node_modules:/app/node_modules
    command: sh -c "npm install"

  db:
    profiles: ['lv-web', 'lv-pyapi', 'prisma-migrate', 'python-typegen']
    container_name: lv-db
    image: lv-db
    restart: always
    build:
      context: ./packages/database/prisma
      dockerfile: Dockerfile
    ports:
      - '3772:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - we can add create_db.sql

  mock-db:
    profiles: ['mock-db', 'mock-seed']
    container_name: lv-mock-db
    image: lv-db
    restart: always
    build:
      context: ./packages/database/prisma
      dockerfile: Dockerfile
    ports:
      - '3773:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_mock_data:/var/lib/postgresql/data

  test-postgres:
    profiles: ['tests']
    container_name: lv-test-db
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=test_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d test_db']
      interval: 5s
      timeout: 5s
      retries: 5

  test-migrate:
    profiles: ['tests']
    container_name: lv-test-db-migrate
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile.web
    depends_on:
      - test-postgres
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@test-postgres:5432/test_db
      - DIRECT_DATABASE_URL=postgresql://postgres:postgres@test-postgres:5432/test_db
    command: sh -c "
      echo 'Waiting for test database...' &&
      until pg_isready -h test-postgres -U postgres -d test_db; do sleep 1; done &&
      cd packages/database &&
      npx prisma migrate deploy
      "
    volumes:
      - .:/app
      - /app/node_modules

  test-runner:
    profiles: ['tests']
    container_name: lv-test-runner
    build:
      context: .
      dockerfile: ./apps/lv-pyapi/Dockerfile
    depends_on:
      - test-migrate
    environment:
      - TEST_DATABASE_URL=postgresql://postgres:postgres@test-postgres:5432/test_db
      - DATABASE_URL=postgresql://postgres:postgres@test-postgres:5432/test_db
      - PYTHONPATH=/app/apps/lv-pyapi:/app/packages/python-utils/src
      - GOOGLE_APPLICATION_CREDENTIALS=/app/apps/lv-pyapi/credentials/google-credentials.json
    volumes:
      - .:/app
    command: pytest tests --ignore=tests/manual --asyncio-mode=auto

  livekit:
    profiles: ['lv-web', 'livekit']
    container_name: livekit
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    restart: always

  # ── Observability stack (LGTM) ──────────────────────────────────────────────
  otel-collector:
    profiles: ['observability']
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317'   # OTLP gRPC
      - '4318:4318'   # OTLP HTTP
      - '8889:8889'   # Prometheus metrics scrape endpoint
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  tempo:
    profiles: ['observability']
    container_name: tempo
    image: grafana/tempo:2.10.1
    command: ['-config.file=/etc/tempo.yaml', '-target=all']
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - '3200:3200'   # Tempo HTTP API
    restart: unless-stopped

  loki:
    profiles: ['observability']
    container_name: loki
    image: grafana/loki:latest
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - '3100:3100'   # Loki HTTP API
    restart: unless-stopped

  mimir:
    profiles: ['observability']
    container_name: mimir
    image: grafana/mimir:latest
    command: ['-config.file=/etc/mimir/mimir.yaml']
    volumes:
      - ./observability/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_data:/data/mimir
    ports:
      - '9009:9009'   # Mimir HTTP API / remote-write
    restart: unless-stopped

  grafana:
    profiles: ['observability']
    container_name: grafana
    image: grafana/grafana:latest
    env_file:
      - ./observability/.env.grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'   # Grafana UI (3001 to avoid conflict with lv-web on 3000)
    depends_on:
      - mimir
      - tempo
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_test_data:
  postgres_mock_data:
  tempo_data:
  loki_data:
  mimir_data:
  grafana_data:
